name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies & accept SDK licenses
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev
        pip install --upgrade buildozer Cython==0.29.33
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | yargs $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Build APK with Buildozer
      run: yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FacturaApp-APK
        path: bin/*.apk
