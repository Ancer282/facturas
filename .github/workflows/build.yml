name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            cmake

          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install Cython==0.29.33

      - name: Remove runner Android environment variables
        run: |
          echo "Before cleanup:"
          env | grep -E 'ANDROID|NDK' || true

          echo "ANDROID_NDK_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=" >> "$GITHUB_ENV"

          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK

          echo "After cleanup:"
          env | grep -E 'ANDROID|NDK' || true

      - name: Prepare Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FacturaApp-APK
          path: bin/*.apk
          if-no-files-found: error
